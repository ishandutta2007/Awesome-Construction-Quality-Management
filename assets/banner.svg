<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="gold-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-wave{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.05) translate(-10px,5px);opacity:.6}}@keyframes check-glow{0%{filter:drop-shadow(0 0 4px rgba(251,191,36,.4))}50%{filter:drop-shadow(0 0 12px rgba(251,191,36,.8))}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-size:42px;font-weight:900;fill:#fff;letter-spacing:-.5px}.subtitle{font-size:20px;font-weight:500;fill:#94a3b8}.badge-text{font-size:14px;font-weight:700;fill:#38bdf8}.animated-bg-circle{animation:pulse-wave 8s ease-in-out infinite;transform-origin:center}.animated-flow-line{stroke-dasharray:10,10;animation:dash-flow 3s linear infinite}.quality-check{animation:check-glow 3s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><g opacity=".15"><path stroke="#94a3b8" stroke-width="1" d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300"/><path stroke="#94a3b8" stroke-width="1" d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360"/></g><circle cx="1020" cy="180" r="140" fill="#38bdf8" class="animated-bg-circle" opacity=".05"/><circle cx="1100" cy="80" r="90" fill="#818cf8" class="animated-bg-circle" opacity=".08"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 800,280 L 950,180 L 1150,220" class="animated-flow-line" opacity=".4"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 750,100 L 900,60 L 1100,120" class="animated-flow-line" opacity=".3"/><rect width="8" height="230" x="50" y="65" fill="url(#accent-grad)" rx="4"/><g transform="translate(80, 0)"><rect width="280" height="32" x="0" y="65" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.5" rx="16"/><text x="16" y="86" class="badge-text">🏗️ CONSTRUCTION TECH ECOSYSTEM</text><text x="0" y="145" class="title">Awesome Construction</text><text x="0" y="195" fill="url(#accent-grad)" class="title">Quality Management 🏗️✨</text><text x="0" y="240" class="subtitle">Curated SaaS Platforms, BIM Model Validators &amp; Open-Source Field Tools</text><text x="0" y="270" fill="#64748b" class="subtitle" font-size="16">ITP Workflows • Punch Lists • NCR Tracking • ISO 19650 &amp; IFC Standards</text></g><g class="quality-check" transform="translate(980, 180)"><polygon fill="#1e293b" stroke="url(#accent-grad)" stroke-width="3" points="0 -70 60 -35 60 35 0 70 -60 35 -60 -35"/><polygon fill="none" stroke="#475569" stroke-dasharray="4 4" stroke-width="1.5" points="0 -55 47 -27 47 27 0 55 -47 27 -47 -27"/><circle cx="0" cy="0" r="36" fill="url(#gold-grad)" filter="url(#glow)"/><path fill="none" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M -12,-2 L -4,7 L 14,-11"/></g></svg>